# Expoideas con Docker Compose: MySQL, API y app (Nginx).
#
#   cp .env.example .env     # y rellenar los valores
#   docker compose up -d --build
#
# Solo la app publica un puerto; MySQL y la API quedan en la red interna.
# Guía completa: docs/despliegue.md

name: expoideas

# Los tres servicios comparten el mismo límite de logs: json-file con rotación,
# para que lo que dice el perfil prod (server.compression, etc.) no se vuelva
# mentira por un disco lleno de logs sin rotar.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: expoideas
      MYSQL_USER: ${DB_USERNAME:-expoideas}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./expoideas-api
    restart: unless-stopped
    logging: *logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/expoideas
      DB_USERNAME: ${DB_USERNAME:-expoideas}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (openssl rand -base64 32)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-4h}
      # La app llama a la API por el mismo origen: no hace falta abrir CORS.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Correo: servidor SMTP de TI. Sin MAIL_HOST no se envía nada.
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@unisimon.edu.co}
      APP_URL: ${APP_URL:-}
    volumes:
      # FILES_DIR=/data/files ya viene fijado en el Dockerfile de la API.
      - files:/data/files

  app:
    build: ./expoideas-app
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"

  # Solo en desarrollo (docker compose --profile dev up -d mailpit): atrapa los
  # correos que envía la API y los muestra en http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
  files:
