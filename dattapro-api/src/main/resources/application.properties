# ==========================================
# Expoideas - Configuración de la Aplicación
# ==========================================
# Los valores sensibles NO tienen default a propósito: si falta la variable
# de entorno la app debe fallar al arrancar, no caer en una credencial de ejemplo.
# Para desarrollo local usa application-local.properties (ignorado por git):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.application.name=expoideas-api

# --- Base de Datos MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Servidor ---
server.port=${PORT:8080}

# --- Flyway ---
# El esquema lo gobiernan las migraciones de db/migration, no Hibernate ni un
# dump con fecha en el nombre.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- JPA / Hibernate ---
# 'validate': Hibernate no toca el esquema, solo comprueba que el mapeo cuadre
# con lo que dejo Flyway. Si no cuadra, la app no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Respeta los nombres exactos de @Column y @JoinColumn
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# --- CORS ---
# Lista separada por comas de los orígenes permitidos.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Seguridad / JWT ---
# Genera una clave nueva con: openssl rand -base64 32
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:14400000}
