version: 2
updates:
  - package-ecosystem: npm
    directory: /expoideas-app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /expoideas-api
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /expoideas-api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /expoideas-app
    schedule:
      interval: weekly
