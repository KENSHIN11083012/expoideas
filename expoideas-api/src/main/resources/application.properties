# ==========================================
# Expoideas - Configuración de la Aplicación
# ==========================================
# Los valores sensibles NO tienen default a propósito: si falta la variable
# de entorno la app debe fallar al arrancar, no caer en una credencial de ejemplo.
# Para desarrollo local usa config/application-local.properties (ignorado por git):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.application.name=expoideas-api

# --- Base de Datos MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Servidor ---
server.port=${PORT:8080}

# --- Subida de archivos ---
# TI fija un máximo de 5 MB por archivo. Una petición puede traer algo de
# formulario además del archivo. Si se pasa, la API responde 413.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Archivos ---
# Carpeta donde se guarda el contenido de los archivos subidos (fotos,
# entregables). Debe quedar fuera del repositorio y de lo que publica el servidor
# web, y entrar en las copias de seguridad junto con la BD.
app.archivos.directorio=${ARCHIVOS_DIR:uploads}

# --- Esquema ---
# Lo gobiernan las migraciones de Flyway (db/migration). 'validate': Hibernate no
# toca el esquema, solo comprueba que el mapeo cuadre con lo que dejó Flyway. Si
# no cuadra, la app no arranca.
spring.jpa.hibernate.ddl-auto=validate
# Sin open-in-view la sesión de Hibernate se cierra al terminar cada método
# @Transactional: las consultas quedan dentro de los servicios, que devuelven DTOs.
spring.jpa.open-in-view=false

# Respeta los nombres exactos de @Column y @JoinColumn
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# --- Salud (Actuator) ---
# Por defecto Actuator solo publica /actuator/health, sin detalles. Lo consulta el
# orquestador para saber si la API está viva (liveness) y lista (readiness).
management.endpoint.health.probes.enabled=true

# --- CORS ---
# Lista separada por comas de los orígenes permitidos.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Seguridad / JWT ---
# Genera una clave nueva con: openssl rand -base64 32
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:14400000}
