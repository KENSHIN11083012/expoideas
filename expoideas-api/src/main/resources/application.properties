# ==========================================
# Expoideas - Configuración de la aplicación
# ==========================================
# Los valores sensibles NO tienen valor por defecto a propósito: si falta la
# variable de entorno, la API no arranca en vez de caer en una credencial de ejemplo.
# Para desarrollo local usa config/application-local.properties (ignorado por git):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.application.name=expoideas-api

# --- Base de datos MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Servidor ---
server.port=${PORT:8080}
# Al apagar (una actualización, un reinicio) deja de aceptar peticiones nuevas y
# termina las que están en curso, con 20 s de plazo, en vez de cortarlas. Es el
# valor por defecto de Spring Boot; va escrito porque docker-compose.yml cuenta
# con él para su stop_grace_period.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Subida de archivos ---
# TI fija un máximo de 5 MB por archivo. Una petición puede traer algo de
# formulario además del archivo. Si se pasa, la API responde 413.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Esquema ---
# Lo gobiernan las migraciones de Flyway (db/migration). 'validate': Hibernate no
# toca el esquema, solo comprueba que el mapeo cuadre con lo que dejó Flyway. Si
# no cuadra, la API no arranca. Las columnas siguen la convención de Spring:
# firstName -> first_name, campus -> campus_id.
spring.jpa.hibernate.ddl-auto=validate
# Sin open-in-view la sesión de Hibernate se cierra al terminar cada método
# @Transactional: las consultas quedan dentro de los servicios, que devuelven DTOs.
spring.jpa.open-in-view=false

# --- Salud (Actuator) ---
# Por defecto Actuator solo publica /actuator/health, sin detalles. Lo consulta el
# orquestador para saber si la API está viva (liveness) y lista (readiness).
management.endpoint.health.probes.enabled=true
# /actuator/info dice qué versión está corriendo: la etiqueta de la imagen (el
# commit), o «local» si se compiló fuera de la integración continua. Nginx no
# publica /actuator: solo se consulta desde dentro del servidor.
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Idearium
info.app.version=${APP_VERSION:local}

# --- Expoideas (ver ExpoideasProperties) ---
# Clave de firma de las sesiones. Genera una con: openssl rand -base64 32
expoideas.jwt.secret=${JWT_SECRET:}
# Vigencia de la sesión: 4h, 30m... (un número sin unidad son milisegundos).
expoideas.jwt.expiration=${JWT_EXPIRATION:4h}
# Orígenes que pueden llamar a la API desde el navegador, separados por comas.
# Vacío: solo el mismo origen, como detrás de Nginx en producción.
expoideas.cors.allowed-origins=${ALLOWED_ORIGINS:}
# Fallos seguidos de inicio de sesión que bloquean una cuenta, y por cuánto tiempo.
expoideas.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
expoideas.login.lock-duration=${LOGIN_LOCK_DURATION:5m}
# Carpeta del contenido de los archivos subidos (fotos, entregables). Debe
# quedar fuera del repositorio y de lo que publica el servidor web, y entrar en
# las copias de seguridad junto con la BD.
expoideas.files.directory=${FILES_DIR:uploads}

# --- Tareas en segundo plano ---
# Hoy son solo los correos, que salen en otro hilo después del commit. Pocos
# hilos y una cola con tope: con el SMTP caído, los envíos se acumulan aquí en
# vez de crecer sin límite (ver AsyncConfig para lo que pasa si la cola se llena).
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=correo-
# Al apagar, los envíos en curso tienen medio minuto para terminar.
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

# --- Correo ---
# El servidor SMTP se configura con las variables estándar de Spring:
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
# (y SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true si el servidor lo pide).
# Sin SPRING_MAIL_HOST no se envía nada y queda constancia en el log.
# Remitente de los avisos y URL pública de la app, para los enlaces de los correos.
expoideas.mail.from=${MAIL_FROM:no-reply@unisimon.edu.co}
# Un envío que falla se reintenta: tres intentos, esperando 5 s antes del segundo
# y 10 s antes del tercero. Si ninguno sale, queda en el rastro de auditoría.
expoideas.mail.attempts=${MAIL_ATTEMPTS:3}
expoideas.mail.retry-delay=${MAIL_RETRY_DELAY:5s}
# JavaMail no pone límite por su cuenta: un servidor que no responde dejaría el
# hilo esperando para siempre. En milisegundos: conectar, leer y escribir.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
expoideas.app-url=${APP_URL:}
