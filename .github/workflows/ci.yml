# Integración continua: en cada push a main y en cada pull request corren las
# pruebas de la API y de la app, y se construyen las imágenes Docker.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expoideas-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar y probar
        run: ./mvnw -B verify

  app:
    name: App · lint, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expoideas-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: expoideas-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [api, app]
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen de la API
        run: docker build -t expoideas-api ./expoideas-api
      - name: Construir la imagen de la app
        run: docker build -t expoideas-app ./expoideas-app
