# ==========================================
# Expoideas - Configuración de la aplicación
# ==========================================
# Los valores sensibles NO tienen valor por defecto a propósito: si falta la
# variable de entorno, la API no arranca en vez de caer en una credencial de ejemplo.
# Para desarrollo local usa config/application-local.properties (ignorado por git):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.application.name=expoideas-api

# --- Base de datos MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Servidor ---
server.port=${PORT:8080}

# --- Subida de archivos ---
# TI fija un máximo de 5 MB por archivo. Una petición puede traer algo de
# formulario además del archivo. Si se pasa, la API responde 413.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Esquema ---
# Lo gobiernan las migraciones de Flyway (db/migration). 'validate': Hibernate no
# toca el esquema, solo comprueba que el mapeo cuadre con lo que dejó Flyway. Si
# no cuadra, la API no arranca. Las columnas siguen la convención de Spring:
# firstName -> first_name, campus -> campus_id.
spring.jpa.hibernate.ddl-auto=validate
# Sin open-in-view la sesión de Hibernate se cierra al terminar cada método
# @Transactional: las consultas quedan dentro de los servicios, que devuelven DTOs.
spring.jpa.open-in-view=false

# --- Salud (Actuator) ---
# Por defecto Actuator solo publica /actuator/health, sin detalles. Lo consulta el
# orquestador para saber si la API está viva (liveness) y lista (readiness).
management.endpoint.health.probes.enabled=true

# --- Expoideas (ver ExpoideasProperties) ---
# Clave de firma de las sesiones. Genera una con: openssl rand -base64 32
expoideas.jwt.secret=${JWT_SECRET:}
# Vigencia de la sesión: 4h, 30m... (un número sin unidad son milisegundos).
expoideas.jwt.expiration=${JWT_EXPIRATION:4h}
# Orígenes que pueden llamar a la API desde el navegador, separados por comas.
# Vacío: solo el mismo origen, como detrás de Nginx en producción.
expoideas.cors.allowed-origins=${ALLOWED_ORIGINS:}
# Carpeta del contenido de los archivos subidos (fotos, entregables). Debe
# quedar fuera del repositorio y de lo que publica el servidor web, y entrar en
# las copias de seguridad junto con la BD.
expoideas.files.directory=${FILES_DIR:uploads}
